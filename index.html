<!DOCTYPE html>
<html>
<head>

<title>CPU Scheduling Simulator</title>

<link rel="stylesheet" href="style.css">

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>

<body>

<div class="background"></div>

<div class="container main-card">

<h1 class="text-center">CPU Scheduling Visualizer</h1>

<div class="card-section">

<h3>Add Process</h3>

<div class="row">

<div class="col">
<input type="text" id="pid" placeholder="Process ID" class="form-control">
</div>

<div class="col">
<input type="number" id="arrival" placeholder="Arrival Time" class="form-control">
</div>

<div class="col">
<input type="number" id="burst" placeholder="Burst Time" class="form-control">
</div>

<div class="col">
<input type="number" id="priority" placeholder="Priority" class="form-control">
</div>

<div class="col">
<button onclick="addProcess()" class="btn btn-primary">Add</button>
</div>

</div>

<br>

<button onclick="loadExample()" class="btn btn-secondary">
Load Example Data
</button>

<button onclick="resetData()" class="btn btn-danger">
Reset
</button>

</div>

<div class="card-section">

<h3>Process Table</h3>

<table class="table table-bordered" id="processTable">

<tr>
<th>PID</th>
<th>Arrival</th>
<th>Burst</th>
<th>Priority</th>
</tr>

</table>

</div>

<div class="card-section">

<h3>Select Algorithm</h3>

<select id="algorithm" class="form-control w-25">

<option value="fcfs">FCFS</option>
<option value="sjf">SJF</option>
<option value="priority">Priority</option>
<option value="rr">Round Robin</option>

</select>

<br>

<input type="number" id="quantum"
placeholder="Time Quantum (RR)"
class="form-control w-25">

<br>

<button onclick="runScheduling()" class="btn btn-success">
Run Scheduling
</button>

</div>

<div class="card-section">

<h3>Gantt Chart</h3>

<div id="gantt"></div>

<div id="timeline"></div>

</div>

<div class="card-section">

<h3>Performance Metrics</h3>

<table class="table table-bordered w-50">

<tr>
<th>Average Waiting Time</th>
<th>Average Turnaround Time</th>
</tr>

<tr>
<td id="avgwt"></td>
<td id="avgtat"></td>
</tr>

</table>

</div>

<div class="card-section">

<h3>Performance Graph</h3>

<canvas id="chart"></canvas>

</div>

</div>

<script src="script.js"></script>

</body>
</html>
